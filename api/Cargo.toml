[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
shared = { path = "../shared" } 

# dependencies for db
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-rustls", "postgres", "macros", "chrono" ] }
chrono = { version = "0.4", features = ["serde"] } # Para manejar fechas nativas de la BD